<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Firebase SDK (compat version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .info-box strong { color: #1976D2; }
        #status {
            text-align: center;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: bold;
        }
        #status.active { background: #d4edda; color: #155724; }
        #status.error { background: #f8d7da; color: #721c24; }
        
        .call-box {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .call-box h3 {
            color: #856404;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .call-info {
            margin: 10px 0;
            color: #333;
            font-size: 15px;
        }
        .call-info strong {
            display: inline-block;
            width: 130px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍⚕️ Doctor Dashboard</h1>
        
        <div class="info-box">
            <strong>📡 How it works:</strong><br>
            1. Patient uses robot (Qt app) to call<br>
            2. Robot sends request to backend (Render)<br>
            3. Backend sends notification here via Firebase<br>
            4. You receive patient details instantly!
        </div>
        
        <div id="status">Initializing...</div>
        <button id="refreshBtn" onclick="init()" style="display: none; padding: 10px 20px; margin: 10px auto; display: block; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px;">🔄 Retry Connection</button>
        <div id="callsContainer"></div>
    </div>

    <script>
        // =============================================
        // 🔥 FIREBASE CONFIG (YOUR PROJECT)
        // =============================================
        const firebaseConfig = {
            apiKey: "AIzaSyD1ih39qUdc429FJL6lu-_U1SiVVIU1GbI",
            authDomain: "ai-dobot.firebaseapp.com",
            projectId: "ai-dobot",
            storageBucket: "ai-dobot.firebasestorage.app",
            messagingSenderId: "110620790793",
            appId: "1:110620790793:web:6c0034d575a5016b6ea8d8"
        };

        firebase.initializeApp(firebaseConfig);
        const messaging = firebase.messaging();

        // VAPID key from Firebase Console
        const VAPID_KEY = "BDKuFdPP4BzpwVOs059zbUqZ0HV-shQLxP3DpTPNYN6tJmtxaiq89ChvZgWTWbO466g3z3AdsshexItx7uibJ0Q";
        
        // CHANGE THIS to your Render backend URL
        const BACKEND_URL = "https://backend-jzw7.onrender.com";  // Change to https://your-app.onrender.com
        
        const statusEl = document.getElementById("status");
        const callsContainer = document.getElementById("callsContainer");
        const refreshBtn = document.getElementById("refreshBtn");

        // =============================================
        // 🔧 REGISTER SERVICE WORKER
        // =============================================
        async function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                try {
                    // Try different paths for GitHub Pages
                    const paths = [
                        '/firebase-messaging-sw.js',
                        './firebase-messaging-sw.js',
                        'firebase-messaging-sw.js'
                    ];
                    
                    let registration = null;
                    let lastError = null;
                    
                    for (const path of paths) {
                        try {
                            console.log(`Trying to register service worker at: ${path}`);
                            registration = await navigator.serviceWorker.register(path, {
                                scope: './'
                            });
                            console.log('✅ Service Worker registered at:', path);
                            break;
                        } catch (err) {
                            console.warn(`Failed to register at ${path}:`, err.message);
                            lastError = err;
                        }
                    }
                    
                    if (!registration) {
                        throw lastError || new Error('Could not register service worker at any path');
                    }
                    
                    return registration;
                } catch (error) {
                    console.error('❌ Service Worker registration failed:', error);
                    throw new Error(`Service Worker registration failed: ${error.message}. Make sure firebase-messaging-sw.js is accessible.`);
                }
            } else {
                throw new Error('Service Workers are not supported in this browser');
            }
        }

        // =============================================
        // 🔍 TEST BACKEND CONNECTION
        // =============================================
        async function testBackendConnection() {
            try {
                console.log('Testing backend connection to:', BACKEND_URL);
                const response = await fetch(`${BACKEND_URL}/`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ Backend is reachable:', data);
                    return true;
                } else {
                    console.warn('⚠️ Backend responded with status:', response.status);
                    return false;
                }
            } catch (error) {
                console.error('❌ Cannot reach backend:', error);
                throw new Error(`Cannot connect to backend at ${BACKEND_URL}. Check if it's running and accessible.`);
            }
        }

        // =============================================
        // 🔔 INITIALIZE
        // =============================================
        async function init() {
            try {
                statusEl.textContent = '🔄 Initializing...';
                statusEl.className = '';
                
                // Step 0: Test backend connection
                console.log('Step 0: Testing backend connection...');
                await testBackendConnection();
                console.log('✅ Backend connection OK');
                
                // Step 1: Register Service Worker (REQUIRED for FCM)
                console.log('Step 1: Registering service worker...');
                await registerServiceWorker();
                console.log('✅ Service worker registered');
                
                // Step 2: Request notification permission
                console.log('Step 2: Requesting notification permission...');
                const permission = await Notification.requestPermission();
                console.log('Permission:', permission);
                
                if (permission !== 'granted') {
                    statusEl.textContent = '❌ Please enable notifications in your browser settings';
                    statusEl.className = 'error';
                    return;
                }
                
                // Step 3: Get FCM token
                console.log('Step 3: Getting FCM token...');
                const token = await messaging.getToken({ 
                    vapidKey: VAPID_KEY
                });
                
                if (!token) {
                    throw new Error('Failed to get FCM token. Make sure service worker is registered.');
                }
                
                console.log('✅ FCM Token received:', token.substring(0, 20) + '...');
                
                // Step 4: Send token to backend
                console.log('Step 4: Registering token with backend...');
                const response = await fetch(`${BACKEND_URL}/api/doctor/register-token`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ token })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Backend error response:', errorText);
                    throw new Error(`Backend error (${response.status}): ${errorText}`);
                }
                
                const result = await response.json();
                console.log('Backend response:', result);
                
                statusEl.textContent = '✅ Ready - Waiting for patient calls...';
                statusEl.className = 'active';
                refreshBtn.style.display = 'none';
                console.log('✅ Successfully registered with backend');
            } catch (error) {
                console.error('❌ Initialization error:', error);
                statusEl.textContent = '❌ Setup failed: ' + error.message;
                statusEl.className = 'error';
                refreshBtn.style.display = 'block';
                
                // Show detailed error in console
                if (error.message.includes('service worker')) {
                    console.error('💡 Tip: Make sure firebase-messaging-sw.js is in the root of your GitHub Pages site');
                }
                if (error.message.includes('CORS')) {
                    console.error('💡 Tip: Check CORS settings in backend.py');
                }
                if (error.message.includes('Cannot connect')) {
                    console.error('💡 Tip: Verify backend URL is correct and backend is running on Render');
                }
            }
        }

        // =============================================
        // 📩 RECEIVE MESSAGES (foreground)
        // =============================================
        messaging.onMessage((payload) => {
            console.log('📨 Incoming message received:', payload);
            
            try {
                // Play notification sound
                const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZSA0PVa3n7qxYEw==');
                audio.play().catch((err) => console.warn('Audio play failed:', err));
                
                // Show browser notification
                if (Notification.permission === 'granted') {
                    const notification = new Notification(
                        payload.notification?.title || '🚨 New Patient Call',
                        {
                            body: payload.notification?.body || 'A patient is calling',
                            icon: '/icon.png',
                            badge: '/badge.png',
                            requireInteraction: true,
                            tag: 'patient-call-' + Date.now()
                        }
                    );
                    
                    notification.onclick = () => {
                        window.focus();
                        notification.close();
                    };
                }
                
                // Display in UI
                const data = payload.data || payload.notification || {};
                showCall({
                    patient_name: data.patient_name || 'Unknown',
                    patient_id: data.patient_id || 'N/A',
                    symptom: data.symptom || data.body || 'Not provided',
                    timestamp: new Date().toISOString()
                });
            } catch (error) {
                console.error('❌ Error handling message:', error);
            }
        });

        // Handle token refresh
        messaging.onTokenRefresh(async () => {
            console.log('🔄 Token refreshed, re-registering...');
            try {
                const newToken = await messaging.getToken({ vapidKey: VAPID_KEY });
                await fetch(`${BACKEND_URL}/api/doctor/register-token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: newToken })
                });
                console.log('✅ New token registered');
            } catch (error) {
                console.error('❌ Failed to register new token:', error);
            }
        });

        // =============================================
        // 🎨 DISPLAY CALL IN UI
        // =============================================
        function showCall(call) {
            const callBox = document.createElement('div');
            callBox.className = 'call-box';
            callBox.innerHTML = `
                <h3>📞 New Patient Call</h3>
                <div class="call-info"><strong>Patient Name:</strong> ${call.patient_name}</div>
                <div class="call-info"><strong>Patient ID:</strong> ${call.patient_id}</div>
                <div class="call-info"><strong>Symptoms:</strong> ${call.symptom}</div>
                <div class="call-info"><strong>Time:</strong> ${new Date(call.timestamp).toLocaleString()}</div>
            `;
            
            callsContainer.insertBefore(callBox, callsContainer.firstChild);
            
            // Remove after 5 minutes
            setTimeout(() => {
                callBox.style.opacity = '0';
                setTimeout(() => callBox.remove(), 300);
            }, 300000);
        }

        // Start on page load
        init();
    </script>
</body>
</html>
