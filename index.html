<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Firebase SDK (compat version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .info-box strong { color: #1976D2; }
        #status {
            text-align: center;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: bold;
        }
        #status.active { background: #d4edda; color: #155724; }
        #status.error { background: #f8d7da; color: #721c24; }
        
        .call-box {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .call-box h3 {
            color: #856404;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .call-info {
            margin: 10px 0;
            color: #333;
            font-size: 15px;
        }
        .call-info strong {
            display: inline-block;
            width: 130px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍⚕️ Doctor Dashboard</h1>
        
        <div class="info-box">
            <strong>📡 How it works:</strong><br>
            1. Patient uses robot (Qt app) to call<br>
            2. Robot sends request to backend (Render)<br>
            3. Backend sends notification here via Firebase<br>
            4. You receive patient details instantly!
        </div>
        
        <div id="status">Initializing...</div>
        <div id="callsContainer"></div>
    </div>

    <script>
        // =============================================
        // 🔥 FIREBASE CONFIG (YOUR PROJECT)
        // =============================================
        const firebaseConfig = {
            apiKey: "AIzaSyD1ih39qUdc429FJL6lu-_U1SiVVIU1GbI",
            authDomain: "ai-dobot.firebaseapp.com",
            projectId: "ai-dobot",
            storageBucket: "ai-dobot.firebasestorage.app",
            messagingSenderId: "110620790793",
            appId: "1:110620790793:web:6c0034d575a5016b6ea8d8"
        };

        firebase.initializeApp(firebaseConfig);
        const messaging = firebase.messaging();

        // VAPID key from Firebase Console
        const VAPID_KEY = "BDKuFdPP4BzpwVOs059zbUqZ0HV-shQLxP3DpTPNYN6tJmtxaiq89ChvZgWTWbO466g3z3AdsshexItx7uibJ0Q";
        
        // CHANGE THIS to your Render backend URL
        const BACKEND_URL = "http://localhost:8000";  // Change to https://your-app.onrender.com
        
        const statusEl = document.getElementById("status");
        const callsContainer = document.getElementById("callsContainer");

        // =============================================
        // 🔔 INITIALIZE
        // =============================================
        async function init() {
            try {
                // Request notification permission
                const permission = await Notification.requestPermission();
                
                if (permission === 'granted') {
                    statusEl.textContent = '✅ Notifications Enabled - Waiting for calls...';
                    statusEl.className = 'active';
                    
                    // Get FCM token
                    const token = await messaging.getToken({ 
                        vapidKey: VAPID_KEY
                    });
                    
                    console.log('FCM Token:', token);
                    
                    // Send token to backend
                    const response = await fetch(`${BACKEND_URL}/api/doctor/register-token`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token })
                    });
                    
                    if (response.ok) {
                        console.log('✅ Token registered with backend');
                    } else {
                        throw new Error('Failed to register with backend');
                    }
                } else {
                    statusEl.textContent = '❌ Please enable notifications';
                    statusEl.className = 'error';
                }
            } catch (error) {
                console.error('Error:', error);
                statusEl.textContent = '❌ Setup failed: ' + error.message;
                statusEl.className = 'error';
            }
        }

        // =============================================
        // 📩 RECEIVE MESSAGES (foreground)
        // =============================================
        messaging.onMessage((payload) => {
            console.log('Incoming message:', payload);
            
            // Play notification sound
            const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZSA0PVa3n7qxYEw==');
            audio.play().catch(() => {});
            
            // Show browser notification
            new Notification(payload.notification.title, {
                body: payload.notification.body,
                icon: '/icon.png',
                badge: '/badge.png',
                requireInteraction: true
            });
            
            // Display in UI
            const data = payload.data || {};
            showCall({
                patient_name: data.patient_name || 'Unknown',
                patient_id: data.patient_id || 'N/A',
                symptom: data.symptom || 'Not provided',
                timestamp: new Date().toISOString()
            });
        });

        // =============================================
        // 🎨 DISPLAY CALL IN UI
        // =============================================
        function showCall(call) {
            const callBox = document.createElement('div');
            callBox.className = 'call-box';
            callBox.innerHTML = `
                <h3>📞 New Patient Call</h3>
                <div class="call-info"><strong>Patient Name:</strong> ${call.patient_name}</div>
                <div class="call-info"><strong>Patient ID:</strong> ${call.patient_id}</div>
                <div class="call-info"><strong>Symptoms:</strong> ${call.symptom}</div>
                <div class="call-info"><strong>Time:</strong> ${new Date(call.timestamp).toLocaleString()}</div>
            `;
            
            callsContainer.insertBefore(callBox, callsContainer.firstChild);
            
            // Remove after 5 minutes
            setTimeout(() => {
                callBox.style.opacity = '0';
                setTimeout(() => callBox.remove(), 300);
            }, 300000);
        }

        // Start on page load
        init();
    </script>
</body>
</html>
