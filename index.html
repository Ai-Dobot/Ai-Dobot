<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Firebase SDK (compat version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }
        #status {
            text-align: center;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: bold;
        }
        #status.active { background: #d4edda; color: #155724; }
        #status.error { background: #f8d7da; color: #721c24; }
        
        .call-box {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .call-box h3 {
            color: #856404;
            margin-bottom: 10px;
        }
        .call-info {
            margin: 8px 0;
            color: #333;
        }
        .call-info strong {
            display: inline-block;
            width: 120px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍⚕️ Doctor Dashboard</h1>
        <div id="status">Initializing...</div>
        <div id="callsContainer"></div>
    </div>

    <script>
        // =============================================
        // 🔥 FIREBASE CONFIG (from your Firebase project)
        // =============================================
        const firebaseConfig = {
            apiKey: "AIzaSyD1ih39qUdc429FJL6lu-_U1SiVVIU1GbI",
            authDomain: "ai-dobot.firebaseapp.com",
            projectId: "ai-dobot",
            storageBucket: "ai-dobot.firebasestorage.app",
            messagingSenderId: "110620790793",
            appId: "1:110620790793:web:6c0034d575a5016b6ea8d8"
        };

        firebase.initializeApp(firebaseConfig);
        const messaging = firebase.messaging();

        // Your VAPID key
        const VAPID_KEY = "BDKuFdPP4BzpwVOs059zbUqZ0HV-shQLxP3DpTPNYN6tJmtxaiq89ChvZgWTWbO466g3z3AdsshexItx7uibJ0Q";
        
        const statusEl = document.getElementById("status");
        const callsContainer = document.getElementById("callsContainer");

        // =============================================
        // 🔔 REQUEST NOTIFICATION PERMISSION
        // =============================================
        async function init() {
            try {
                // Register service worker
                const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
                console.log('Service Worker registered');

                // Request permission
                const permission = await Notification.requestPermission();
                
                if (permission === 'granted') {
                    statusEl.textContent = '✅ Notifications Enabled - Waiting for calls...';
                    statusEl.className = 'active';
                    
                    // Get FCM token
                    const token = await messaging.getToken({ 
                        vapidKey: VAPID_KEY,
                        serviceWorkerRegistration: registration
                    });
                    
                    console.log('FCM Token:', token);
                    
                    // Send token to backend
                    await fetch('http://localhost:8000/api/doctor/register-token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token })
                    });
                    
                    console.log('Token registered with backend');
                } else {
                    statusEl.textContent = '❌ Notifications blocked';
                    statusEl.className = 'error';
                }
            } catch (error) {
                console.error('Error:', error);
                statusEl.textContent = '❌ Setup failed: ' + error.message;
                statusEl.className = 'error';
            }
        }

        // =============================================
        // 📩 RECEIVE MESSAGES (when app is open)
        // =============================================
        messaging.onMessage((payload) => {
            console.log('Incoming call:', payload);
            
            // Show notification
            new Notification(payload.notification.title, {
                body: payload.notification.body,
                icon: '/icon.png'
            });
            
            // Display in UI
            const data = payload.data || {};
            const callBox = document.createElement('div');
            callBox.className = 'call-box';
            callBox.innerHTML = `
                <h3>📞 Incoming Call</h3>
                <div class="call-info"><strong>Patient:</strong> ${data.patient_name || 'Unknown'}</div>
                <div class="call-info"><strong>ID:</strong> ${data.patient_id || 'N/A'}</div>
                <div class="call-info"><strong>Symptoms:</strong> ${data.symptom || 'Not provided'}</div>
                <div class="call-info"><strong>Time:</strong> ${new Date().toLocaleTimeString()}</div>
            `;
            
            callsContainer.insertBefore(callBox, callsContainer.firstChild);
        });

        // Start on page load
        init();
    </script>
</body>
</html>
